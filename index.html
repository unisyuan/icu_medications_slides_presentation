<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>急重症常見藥物 (ICU 護理人員 1 小時培訓簡報)</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@600;800;900&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #1c7ed6;
            --primary-dark: #1864ab;
            --primary-light: #e7f5ff;
            --bg-color: #ffffff; /* 純淨大器背景 */
            --text-dark: #0f172a;
            --text-muted: #334155;
            --border-color: #e2e8f0;
            --red-alert: #dc2626;
            --red-bg: #fef2f2;
            --amber-warn: #d97706;
            --amber-bg: #fffbeb;
            --green-success: #16a34a;
            --green-bg: #f0fdf4;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans TC', 'Outfit', system-ui, -apple-system, sans-serif;
            background-color: #090d16;
            color: var(--text-dark);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 16:9 Presentation Stage - Strict 16:9 Aspect Ratio */
        .stage {
            width: min(98vw, 177.78vh);
            height: min(55.125vw, 95vh);
            aspect-ratio: 16 / 9;
            background-color: var(--bg-color);
            position: relative;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            border-radius: 12px;
            overflow: hidden;
        }

        :fullscreen .stage, .stage:fullscreen {
            width: 100vw;
            height: 100vh;
            max-width: 177.78vh;
            max-height: 56.25vw;
            border-radius: 0;
        }

        /* Header Bar - Borderless Clean Line */
        .slide-header {
            height: 85px;
            padding: 0 50px;
            background: #ffffff;
            border-bottom: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .chapter-badge {
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 800;
            font-size: 20px;
            letter-spacing: 0.5px;
        }

        .slide-title-text {
            font-size: 34px;
            font-weight: 900;
            color: var(--text-dark);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .slide-counter {
            font-family: 'Outfit', sans-serif;
            font-size: 24px;
            font-weight: 900;
            color: var(--primary-dark);
            background: #e0e7ff;
            padding: 8px 22px;
            border-radius: 16px;
        }

        /* Slide Content Main Stage - Expanded 16:9 Space & Mouse Wheel Scrolling */
        .slide-body {
            flex: 1;
            padding: 26px 45px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            background: #ffffff;
            min-height: 0;
            scroll-behavior: smooth;
        }

        /* Custom Modern Scrollbar for Slide Body (Mouse Wheel & Touch) */
        .slide-body::-webkit-scrollbar {
            width: 8px;
        }
        .slide-body::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 4px;
        }
        .slide-body::-webkit-scrollbar-thumb {
            background: #94a3b8;
            border-radius: 4px;
        }
        .slide-body::-webkit-scrollbar-thumb:hover {
            background: var(--primary);
        }

        /* Continuous Flow Layout - Supports Smooth Vertical Scrolling */
        .full-layout {
            display: flex;
            flex-direction: column;
            width: 100%;
            min-height: 100%;
        }

        .frameless-flow {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            min-height: 100%;
            gap: 14px;
            padding-right: 4px;
        }

        .section-block {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .section-title {
            font-size: 23px;
            font-weight: 900;
            color: var(--primary-dark);
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 4px;
            margin-bottom: 2px;
        }

        .section-title i {
            color: var(--primary);
            font-size: 22px;
        }

        .section-title.title-red {
            color: var(--red-alert);
            border-bottom-color: #fee2e2;
        }

        .section-title.title-red i {
            color: var(--red-alert);
        }

        .card-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
            padding-left: 6px;
        }

        .card-list li {
            font-size: 21px;
            line-height: 1.45;
            color: var(--text-dark);
            position: relative;
            padding-left: 24px;
        }

        .card-list li::before {
            content: "•";
            color: var(--primary);
            font-size: 28px;
            position: absolute;
            left: 4px;
            top: -6px;
        }

        .red-list li::before {
            color: var(--red-alert);
        }

        /* Alert Box - Placed inside flow stream so it naturally follows section blocks without overlapping */
        .alert-box {
            background: var(--red-bg);
            border-left: 8px solid var(--red-alert);
            border-radius: 12px;
            padding: 12px 20px;
            color: #991b1b;
            font-weight: 800;
            font-size: 20px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 14px;
            margin-top: 8px;
            margin-bottom: 4px;
            flex-shrink: 0;
        }

        .alert-box i {
            font-size: 26px;
            color: var(--red-alert);
        }

        /* Two Column Layout - Frameless Columns with Natural Flow */
        .frameless-columns {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 35px;
            width: 100%;
            flex: 1;
            min-height: 0;
        }

        .column-block {
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            gap: 14px;
        }

        /* Cover Slide Styling - NO BORDER, NO BOX FRAME, FULL HEIGHT DISTRIBUTION */
        .cover-container {
            text-align: center;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 10px 0;
            background: transparent;
        }

        .cover-icon {
            font-size: 90px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .cover-title {
            font-size: 54px;
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 12px;
            line-height: 1.25;
            letter-spacing: -0.5px;
        }

        .cover-subtitle {
            font-size: 30px;
            font-weight: 800;
            color: var(--primary-dark);
            margin-bottom: 20px;
        }

        .cover-tag {
            display: inline-block;
            background: var(--primary-light);
            color: var(--primary-dark);
            padding: 14px 36px;
            border-radius: 40px;
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 20px;
        }

        .cover-objectives {
            text-align: left;
            padding-top: 20px;
            border-top: 2px solid var(--border-color);
        }

        .cover-objectives h3 {
            color: var(--primary-dark);
            font-size: 25px;
            font-weight: 900;
            margin-bottom: 16px;
        }

        .cover-objectives ul li {
            font-size: 22px;
            line-height: 1.5;
            margin-bottom: 10px;
        }

        /* Transition Slide Styling - FULL HEIGHT DISTRIBUTION */
        .transition-container {
            text-align: center;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            padding: 20px 0;
            background: transparent;
            color: var(--text-dark);
        }

        .transition-icon {
            font-size: 80px;
            color: var(--primary);
            margin-bottom: 16px;
        }

        .transition-title {
            font-size: 58px;
            font-weight: 900;
            color: var(--primary-dark);
            margin-bottom: 16px;
            letter-spacing: -0.5px;
        }

        .transition-desc {
            font-size: 28px;
            line-height: 1.6;
            margin-bottom: 24px;
            color: var(--text-muted);
            font-weight: 700;
        }

        .transition-points {
            border-top: 2px solid var(--border-color);
            padding-top: 24px;
            text-align: left;
        }

        .transition-points h4 {
            font-size: 25px;
            font-weight: 900;
            margin-bottom: 18px;
            color: var(--primary-dark);
        }

        .transition-points ul li {
            font-size: 22px;
            margin-bottom: 12px;
            line-height: 1.5;
            color: var(--text-dark);
        }

        /* Tables Styling - Full Height Even Distribution & Large Clean Fonts */
        .table-wrapper {
            width: 100%;
            height: 100%;
            overflow-x: auto;
            background: white;
            display: flex;
            align-items: stretch;
        }

        table.slide-table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            font-size: 20px;
            text-align: left;
        }

        table.slide-table th {
            background: var(--primary-dark);
            color: white;
            padding: 14px 20px;
            font-weight: 900;
            font-size: 22px;
            vertical-align: middle;
        }

        table.slide-table td {
            padding: 12px 20px;
            border-bottom: 1px solid var(--border-color);
            line-height: 1.4;
            vertical-align: middle;
        }

        table.slide-table tr:nth-child(even) {
            background: #f8fafc;
        }

        table.slide-table td:first-child {
            font-weight: 800;
            color: var(--primary-dark);
            font-size: 22px;
        }

        /* Bottom Controls Bar */
        .controls-bar {
            height: 80px;
            background: #ffffff;
            border-top: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 50px;
            flex-shrink: 0;
        }

        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 30px;
            border-radius: 12px;
            font-size: 19px;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.2s;
        }

        .btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        .btn-outline {
            background: transparent;
            color: var(--text-dark);
            border: 2px solid var(--border-color);
        }

        .btn-outline:hover {
            background: #f1f5f9;
            border-color: var(--text-dark);
        }

        /* Overview Modal Grid */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.96);
            z-index: 9999;
            padding: 50px;
            overflow-y: auto;
        }

        .modal.active { display: block; }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-bottom: 40px;
        }

        .modal-header h2 {
            font-size: 30px;
            font-weight: 900;
        }

        .modal-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
        }

        .thumb-card {
            background: white;
            border-radius: 16px;
            padding: 22px;
            cursor: pointer;
            transition: transform 0.2s;
            border: 3px solid transparent;
        }

        .thumb-card:hover {
            transform: scale(1.04);
            border-color: var(--primary);
        }

        .thumb-card.active {
            border-color: var(--primary);
            box-shadow: 0 0 25px rgba(28, 126, 214, 0.6);
        }

        .thumb-num {
            font-size: 15px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .thumb-title {
            font-size: 18px;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.4;
        }

        @media print {
            body { overflow: visible; background: white; }
            .stage { width: 100%; height: auto; max-width: none; max-height: none; box-shadow: none; }
            .controls-bar, .modal { display: none !important; }
            .slide-body { page-break-after: always; height: 100vh; }
        }
    </style>
</head>
<body>

    <div class="stage">
        <!-- Header -->
        <header class="slide-header">
            <div class="header-left">
                <span class="chapter-badge" id="chapter-badge">單元名稱</span>
                <span class="slide-title-text" id="slide-title">簡報標題</span>
            </div>
            <div class="header-right">
                <span class="slide-counter" id="slide-counter">Slide 01 / 66</span>
            </div>
        </header>

        <!-- Slide Body -->
        <main class="slide-body" id="slide-content">
            <!-- Dynamic Slide Layout Content -->
        </main>

        <!-- Controls Bar -->
        <footer class="controls-bar">
            <button class="btn btn-outline" id="overview-btn">
                <i class="fa-solid fa-border-all"></i> 所有 66 頁總覽 (O)
            </button>

            <div style="display: flex; gap: 20px;">
                <button class="btn btn-outline" id="prev-btn">
                    <i class="fa-solid fa-chevron-left"></i> 上一頁 (←)
                </button>
                <button class="btn" id="next-btn">
                    下一頁 (→) <i class="fa-solid fa-chevron-right"></i>
                </button>
            </div>

            <button class="btn btn-outline" id="fullscreen-btn">
                <i class="fa-solid fa-expand"></i> 全螢幕 (F11)
            </button>
        </footer>
    </div>

    <!-- Overview Grid Modal -->
    <div class="modal" id="overview-modal">
        <div class="modal-header">
            <h2><i class="fa-solid fa-layer-group"></i> 全 66 頁簡報快選導覽</h2>
            <button class="btn btn-outline" id="close-modal-btn" style="color: white; border-color: white;">關閉 (Esc)</button>
        </div>
        <div class="modal-grid" id="modal-grid"></div>
    </div>

    <!-- Slide Database & Script -->
    <script>

                    { num: "單元二", title: "鎮靜、止痛與肌肉鬆弛 (Slide 19-36)", desc: "RASS/SAS 鎮靜深度、PRIS 症候群、鴉片類活性代謝物蓄積、TOF 監測與 Hofmann 代謝" },

                            ` : ''}
                            ${slide.contraindications ? `
                                <div class="section-block">
                                    <div class="section-title title-red"><i class="fa-solid fa-ban"></i> 特殊考量與禁忌症</div>
                                    <ul class="card-list red-list">${slide.contraindications.map(c => `<li>${c}</li>`).join('')}</ul>
                                </div>
                            ` : ''}
                            ${slide.precautions ? `
                                <div class="section-block">
                                    <div class="section-title title-red"><i class="fa-solid fa-user-nurse"></i> 護理注意事項</div>
                                    <ul class="card-list red-list">${slide.precautions.map(p => `<li>${p}</li>`).join('')}</ul>
                                </div>
                            ` : ''}
                            ${slide.alert ? `<div class="alert-box"><i class="fa-solid fa-triangle-exclamation"></i> <div><strong>高警訊提示：</strong> ${slide.alert}</div></div>` : ''}
                        </div>
                    </div>
                `;
            } else if (slide.type === 'multi') {
                html = `
                    <div class="full-layout">
                        <div class="frameless-flow" style="justify-content: space-around; height: 100%;">
                            ${slide.items.map(item => `
                                <div class="section-block" style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 10px 0;">
                                    <div class="section-title" style="font-size: 25px; margin-bottom: 6px;"><i class="fa-solid fa-vial"></i> ${item.name}</div>
                                    <p style="font-size: 22px; color: var(--text-dark); line-height: 1.5; padding-left: 6px;">${item.desc}</p>
                                </div>
                            `).join('')}
                            ${slide.alert ? `<div class="alert-box"><i class="fa-solid fa-triangle-exclamation"></i> <div><strong>高警訊提示：</strong> ${slide.alert}</div></div>` : ''}
                        </div>
                    </div>
                `;
            } else if (slide.type === 'proto') {
                html = `
                    <div class="full-layout">
                        <div class="frameless-flow" style="justify-content: space-around; height: 100%;">
                            ${slide.protocols.map(p => `
                                <div class="section-block" style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 12px 0;">
                                    <div class="section-title" style="font-size: 26px; margin-bottom: 8px;"><i class="fa-solid fa-clipboard-check"></i> ${p.title}</div>
                                    <p style="font-size: 23px; line-height: 1.55; color: var(--text-dark); padding-left: 6px;">${p.content}</p>
                                </div>
                            `).join('')}
                            ${slide.alert ? `<div class="alert-box"><i class="fa-solid fa-triangle-exclamation"></i> <div><strong>高警訊提示：</strong> ${slide.alert}</div></div>` : ''}
                        </div>
                    </div>
                `;
            } else if (slide.type === 'summary') {
                html = `
                    <div class="full-layout">
                        <div class="frameless-flow" style="display: flex; flex-direction: column; height: 100%;">
                            <div class="section-title title-red" style="font-size: 30px; margin-bottom: 16px;"><i class="fa-solid fa-shield-halved"></i> 本單元護理監測重點與高警訊提醒</div>
                            <ul class="card-list red-list" style="display: flex; flex-direction: column; justify-content: space-around; flex: 1; padding: 10px 0;">
                                ${slide.points.map(pt => `<li style="font-size: 25px; line-height: 1.6; padding: 12px 0 12px 32px;">${pt}</li>`).join('')}
                            </ul>
                        </div>
                    </div>
                `;
            } else if (slide.type === 'conclusion') {
                html = `
                    <div class="full-layout">
                        <div class="frameless-flow" style="justify-content: space-between; height: 100%;">
                            <div class="section-title" style="font-size: 28px;"><i class="fa-solid fa-award"></i> 急重症護理給藥黃金 5 大防線</div>
                            <div style="display: flex; flex-direction: column; justify-content: space-around; flex: 1; margin: 10px 0;">
                                ${slide.rules.map(r => `
                                    <div style="padding: 6px 0; border-bottom: 1px solid var(--border-color);">
                                        <div style="font-weight: 900; color: var(--primary-dark); font-size: 22px; margin-bottom: 3px;">${r.title}</div>
                                        <div style="font-size: 20px; color: var(--text-dark); line-height: 1.45;">${r.detail}</div>
                                    </div>
                                `).join('')}
                            </div>
                            <div style="background: var(--primary-light); padding: 16px 20px; border-radius: 14px; text-align: center; font-size: 20px; font-weight: 800; color: var(--primary-dark); margin-bottom: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                                💬 「${slide.quote}」
                            </div>
                            ${slide.qa ? `
                                <div style="text-align: center; font-size: 28px; font-weight: 900; color: var(--green-success);">
                                    <i class="fa-solid fa-comments"></i> ${slide.qa}
                                </div>
                            ` : ''}
                        </div>
                    </div>
                `;
            }

            container.innerHTML = html;
            updateOverviewActive();
        }

        function populateOverviewModal() {
            const grid = document.getElementById('modal-grid');
            grid.innerHTML = '';
            document.querySelector('.modal-header h2').innerHTML = `<i class="fa-solid fa-layer-group"></i> 全 ${slides.length} 頁簡報快選導覽`;
            slides.forEach((s, idx) => {
                const card = document.createElement('div');
                card.className = `thumb-card ${idx === currentIndex ? 'active' : ''}`;
                card.onclick = () => {
                    renderSlide(idx);
                    closeOverview();
                };
                card.innerHTML = `
                    <div class="thumb-num">Slide ${String(s.num).padStart(2, '0')} (${s.chapter})</div>
                    <div class="thumb-title">${s.title}</div>
                `;
                grid.appendChild(card);
            });
        }

        function updateOverviewActive() {
            document.querySelectorAll('.thumb-card').forEach((card, idx) => {
                if (idx === currentIndex) card.classList.add('active');
                else card.classList.remove('active');
            });
        }

        function openOverview() {
            populateOverviewModal();
            document.getElementById('overview-modal').classList.add('active');
        }

        function closeOverview() {
            document.getElementById('overview-modal').classList.remove('active');
        }

        // Navigation Bindings
        document.getElementById('prev-btn').onclick = () => renderSlide(currentIndex - 1);
        document.getElementById('next-btn').onclick = () => renderSlide(currentIndex + 1);
        document.getElementById('overview-btn').onclick = openOverview;
        document.getElementById('close-modal-btn').onclick = closeOverview;

        document.getElementById('fullscreen-btn').onclick = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
            }
        };

        // Keyboard Navigation
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
                renderSlide(currentIndex + 1);
            } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
                renderSlide(currentIndex - 1);
            } else if (e.key === 'o' || e.key === 'O') {
                const modal = document.getElementById('overview-modal');
                if (modal.classList.contains('active')) closeOverview();
                else openOverview();
            } else if (e.key === 'Escape') {
                closeOverview();
            }
        });

        // Initialize First Slide
        renderSlide(0);
    </script>
</body>
</html>
